<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f3f7" />
    <title>Weintour</title>
    <style>
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      :root {
        --purple: #643985;
        --ink: #292333;
        --muted: #756d7e;
        --line: #e6dfea;
        --green: #236840;
      }
      body {
        margin: 0;
        background: #f5f3f7;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        max-width: 780px;
        margin: auto;
        padding: 24px 16px 48px;
      }
      header,
      .row,
      .actions,
      .tabs {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      header {
        justify-content: space-between;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 30px;
        margin: 0;
      }
      h2 {
        margin: 0 0 16px;
      }
      h3 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        line-height: 1.5;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      .btn {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 15px;
        background: white;
        color: var(--ink);
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        min-height: 44px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 3px solid #bda1d1;
        outline-offset: 3px;
      }
      .primary {
        background: var(--purple);
        color: white;
        border-color: var(--purple);
        font-weight: 700;
      }
      .success {
        background: var(--green);
        border-color: var(--green);
        color: white;
        font-weight: 700;
      }
      .danger {
        color: #a83232;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 18px;
        border: 1px solid var(--line);
        margin-bottom: 16px;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .menu {
        width: 100%;
        text-align: left;
        padding: 20px;
        margin-bottom: 12px;
        border-radius: 18px;
      }
      .menu strong {
        font-size: 21px;
      }
      .menu small {
        display: block;
        margin-top: 7px;
        color: var(--muted);
        line-height: 1.5;
      }
      input:not([type="checkbox"]):not([type="file"]),
      select,
      textarea {
        width: 100%;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: white;
        color: var(--ink);
        font-size: 16px;
      }
      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: var(--purple);
        flex-shrink: 0;
      }
      input[type="file"] {
        max-width: 100%;
        font-size: 14px;
      }
      .form {
        display: grid;
        gap: 14px;
      }
      .form label {
        display: grid;
        gap: 7px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 12px 0;
        line-height: 1.5;
      }
      .tabs {
        margin-bottom: 18px;
      }
      .tabs button {
        flex: 1;
      }
      .tabs button[aria-selected="true"] {
        background: var(--purple);
        color: white;
        border-color: var(--purple);
      }
      .stats {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0 20px;
      }
      .pill {
        background: #f0eaf5;
        border-radius: 20px;
        padding: 6px 11px;
        font-size: 13px;
      }
      .pill.done {
        background: #e7f2ea;
        color: var(--green);
      }
      .customer {
        padding: 16px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 15px;
        margin-bottom: 12px;
      }
      .customer-head {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 10px;
      }
      .customer-head strong {
        font-size: 18px;
      }
      .customer .check {
        margin: 0;
      }
      .customer summary,
      summary {
        cursor: pointer;
        min-height: 44px;
        display: flex;
        align-items: center;
        font-weight: 600;
      }
      .customer details {
        border-top: 1px solid var(--line);
        margin-top: 12px;
      }
      .note {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .current {
        border: 2px solid #c6add8;
      }
      .current h3 {
        font-size: 27px;
      }
      .current .actions > * {
        flex: 1;
        text-align: center;
      }
      .document {
        margin: 16px 0;
        padding: 12px;
        background: #f5f3f7;
        border-radius: 12px;
      }
      .document p {
        margin: 4px 0 10px;
      }
      .document details {
        margin-top: 8px;
      }
      .hotel {
        margin-top: 18px;
      }
      .hotel summary {
        gap: 8px;
      }
      .alert {
        color: #a83232;
      }
      .progress {
        width: 100%;
        height: 9px;
        accent-color: var(--purple);
      }
      .empty {
        text-align: center;
        padding: 24px;
        color: var(--muted);
      }
      @media (max-width: 480px) {
        .wrap {
          padding: 18px 12px 36px;
        }
        .card {
          padding: 16px;
        }
        h1 {
          font-size: 26px;
        }
        .actions button,
        .actions .btn {
          flex-grow: 1;
          text-align: center;
        }
        .current .actions {
          display: grid;
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>&#127815; Weintour</h1>
        <button id="logout" hidden>Abmelden</button>
      </header>
      <section id="login" class="card">
        <h2>Anmelden</h2>
        <form id="loginForm" class="form">
          <label
            >E-Mail<input id="email" type="email" autocomplete="username" required
          /></label>
          <label
            >Passwort<input
              id="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <button class="primary" type="submit">Anmelden</button>
          <p id="loginMessage" role="status"></p>
        </form>
      </section>
      <div id="app" hidden>
        <section id="home">
          <button class="menu" data-page="kunde">
            <strong>&#10133; Kunde anlegen</strong
            ><small>Adresse, Kontakt und Tour hinterlegen</small>
          </button>
          <button class="menu" data-page="muenchen">
            <strong>&#128666; M&#252;nchen-Tour</strong
            ><small>Kunden im S&#252;den planen und besuchen</small>
          </button>
          <button class="menu" data-page="berlin">
            <strong>&#128666; Berlin-Tour</strong
            ><small>Kunden im Norden planen und besuchen</small>
          </button>
        </section>
        <section id="page" hidden>
          <button id="back">&#8592; &#220;bersicht</button>
          <h2 id="title" style="margin-top: 20px"></h2>
          <div id="content"></div>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const supabaseClient = supabase.createClient(
        "https://grrkvuqxjglfuynmxegv.supabase.co",
        "sb_publishable_5P58BQr8tEksRLUqb8vmOg_uEM_MA24",
      );
      const ZUHAUSE =
        "Kaiserbachstra\u{df}e 20, 76831 Heuchelheim-Klingen, Deutschland";
      const $ = (id) => document.getElementById(id);
      const names = { muenchen: "M\u{fc}nchen-Tour", berlin: "Berlin-Tour" };
      let userId = null,
        page = null,
        rows = [],
        loadVersion = 0;
      const states = {},
        views = {},
        searches = {},
        filters = {};
      function node(tag, text, cls) {
        const e = document.createElement(tag);
        if (text !== undefined) e.textContent = text;
        if (cls) e.className = cls;
        return e;
      }
      function button(text, action, cls = "") {
        const b = node("button", text, cls);
        b.type = "button";
        b.onclick = async () => {
          b.disabled = true;
          try {
            await action();
          } catch (e) {
            alert(e.message);
          } finally {
            b.disabled = false;
          }
        };
        return b;
      }
      function address(k) {
        return k.strasse && k.ort
          ? [k.strasse, k.plz, k.ort, "Deutschland"].filter(Boolean).join(", ")
          : "";
      }
      function state(t) {
        if (!states[t]) {
          let s = {};
          try {
            s =
              JSON.parse(
                sessionStorage.getItem("weintour-steuerung-" + userId + "-" + t),
              ) || {};
          } catch {}
          states[t] = {
            gestartet: s.gestartet === true,
            pause: s.pause === true,
            hotel: typeof s.hotel === "string" ? s.hotel : "",
            automatisch: s.automatisch !== false,
          };
        }
        return states[t];
      }
      function saveState(t) {
        try {
          sessionStorage.setItem(
            "weintour-steuerung-" + userId + "-" + t,
            JSON.stringify(state(t)),
          );
        } catch {}
      }
      function mobile() {
        return (
          /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }
      function reserveMap() {
        if (mobile()) return null;
        const tab = window.open("about:blank", "_blank");
        if (tab) tab.opener = null;
        return tab;
      }
      function navigate(a, tab = null) {
        const url =
          "https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=" +
          encodeURIComponent(a);
        if (tab && !tab.closed) {
          tab.location.replace(url);
        } else if (mobile()) {
          window.location.assign(url);
        } else {
          const link = node("a");
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          document.body.append(link);
          link.click();
          link.remove();
        }
      }
      function showHome() {
        loadVersion++;
        page = null;
        $("home").hidden = false;
        $("page").hidden = true;
        $("content").replaceChildren();
      }
      function setAuth(session) {
        const next = session?.user.id || null;
        if (next !== userId) {
          userId = next;
          rows = [];
          for (const obj of [states, views, searches, filters])
            for (const k of Object.keys(obj)) delete obj[k];
          showHome();
        }
        $("login").hidden = !!session;
        $("app").hidden = !session;
        $("logout").hidden = !session;
      }
      $("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const b = e.target.querySelector("button");
        b.disabled = true;
        $("loginMessage").textContent = "Anmeldung l\u{e4}uft \u{2026}";
        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: $("email").value.trim(),
            password: $("password").value,
          });
          if (error) throw error;
          $("password").value = "";
          $("loginMessage").textContent = "";
          setAuth(data.session);
        } catch (err) {
          $("loginMessage").textContent = "Anmeldung fehlgeschlagen: " + err.message;
        } finally {
          b.disabled = false;
        }
      };
      $("logout").onclick = async () => {
        const { error } = await supabaseClient.auth.signOut({ scope: "local" });
        if (error) {
          alert(error.message);
          return;
        }
        window.location.reload();
      };
      supabaseClient.auth.onAuthStateChange((_event, session) => setAuth(session));
      supabaseClient.auth.getSession().then(({ data, error }) => {
        if (error) $("loginMessage").textContent = error.message;
        else setAuth(data.session);
      });
      $("back").onclick = showHome;
      document
        .querySelectorAll("[data-page]")
        .forEach((b) => (b.onclick = () => showPage(b.dataset.page)));
      async function showPage(t) {
        if (!userId) return;
        page = t;
        $("home").hidden = true;
        $("page").hidden = false;
        $("title").textContent = names[t] || "Kunde anlegen";
        if (t === "kunde") {
          loadVersion++;
          customerForm();
          return;
        }
        if (!views[t]) views[t] = state(t).gestartet ? "fahrt" : "planung";
        try {
          await loadCustomers(t);
        } catch (e) {
          $("content").replaceChildren(
            node("p", "Laden fehlgeschlagen: " + e.message, "alert"),
            button("Erneut versuchen", () => showPage(t)),
          );
        }
      }
      async function loadCustomers(t) {
        const version = ++loadVersion,
          uid = userId;
        const { data, error } = await supabaseClient
          .from("kunden")
          .select("*")
          .eq("tour", t)
          .order("name");
        if (error) throw error;
        if (version !== loadVersion || page !== t || uid !== userId) return null;
        rows = data || [];
        renderTour(t);
        return rows;
      }
      function renderTour(t) {
        if (page !== t || !userId) return;
        const c = $("content");
        c.replaceChildren();
        const tabs = node("div", undefined, "tabs");
        tabs.setAttribute("role", "tablist");
        for (const [v, label] of [
          ["planung", "\u{1f4cb} Planung"],
          ["fahrt", "\u{1f69a} Aktive Tour"],
        ]) {
          const b = button(label, () => {
            views[t] = v;
            renderTour(t);
          });
          b.setAttribute("role", "tab");
          b.setAttribute("aria-selected", String(views[t] === v));
          tabs.append(b);
        }
        c.append(tabs);
        const selected = rows.filter((k) => k.geplant),
          done = selected.filter((k) => k.erledigt).length;
        const stats = node("div", undefined, "stats");
        for (const text of [
          selected.length + " ausgew\u{e4}hlt",
          selected.length - done + " offen",
          done + " erledigt",
        ])
          stats.append(node("span", text, "pill"));
        c.append(stats);
        if (views[t] === "planung") renderPlan(t, c);
        else renderDrive(t, c, selected);
      }
      function renderPlan(t, c) {
        const tools = node("div", undefined, "card form");
        const search = node("input");
        search.type = "search";
        search.placeholder = "Kunde, Ort oder PLZ suchen";
        search.setAttribute("aria-label", "Kunden suchen");
        search.value = searches[t] || "";
        const filter = node("select");
        filter.setAttribute("aria-label", "Kunden filtern");
        for (const [value, text] of [
          ["alle", "Alle Kunden"],
          ["auswahl", "Nur ausgew\u{e4}hlte Kunden"],
          ["offen", "Ausgew\u{e4}hlte, offene Kunden"],
          ["erledigt", "Ausgew\u{e4}hlte, erledigte Kunden"],
        ]) {
          const o = node("option", text);
          o.value = value;
          filter.append(o);
        }
        filter.value = filters[t] || "alle";
        tools.append(
          search,
          filter,
          button("\u{2795} Kunde anlegen", () => {
            page = "kunde";
            loadVersion++;
            $("title").textContent = "Kunde anlegen";
            customerForm(null, t);
          }),
        );
        c.append(tools);
        const list = node("div");
        c.append(list);
        function draw() {
          list.replaceChildren();
          const q = search.value.trim().toLocaleLowerCase("de");
          const found = rows
            .filter((k) =>
              [k.name, k.ansprechpartner, k.ort, k.plz, k.strasse]
                .filter(Boolean)
                .join(" ")
                .toLocaleLowerCase("de")
                .includes(q),
            )
            .filter(
              (k) =>
                filter.value === "alle" ||
                (k.geplant &&
                  (filter.value === "auswahl" ||
                    (filter.value === "offen" ? !k.erledigt : k.erledigt))),
            );
          if (!found.length)
            list.append(
              node(
                "p",
                rows.length
                  ? "Keine passenden Kunden gefunden."
                  : "Noch keine Kunden gespeichert.",
                "empty",
              ),
            );
          for (const k of found) list.append(customerCard(k, t));
        }
        search.oninput = () => {
          searches[t] = search.value;
          draw();
        };
        filter.onchange = () => {
          filters[t] = filter.value;
          draw();
        };
        draw();
      }
      function customerCard(k, t) {
        const card = node("article", undefined, "customer");
        const head = node("div", undefined, "customer-head");
        const text = node("div");
        text.append(
          node("strong", k.name || "Ohne Name"),
          node(
            "p",
            [k.plz, k.ort].filter(Boolean).join(" ") || "Ort noch nicht hinterlegt",
            "muted",
          ),
        );
        const check = node("input");
        check.type = "checkbox";
        check.checked = !!k.geplant;
        const label = node("label", undefined, "check");
        label.append(check, node("span", "Auswahl"));
        check.setAttribute(
          "aria-label",
          k.name + " f\u{fc}r die Fahrt ausw\u{e4}hlen",
        );
        check.onchange = async () => {
          check.disabled = true;
          try {
            await updateCustomer(k.id, { geplant: check.checked, erledigt: false });
            await loadCustomers(t);
          } catch (e) {
            check.checked = !check.checked;
            alert(e.message);
          } finally {
            check.disabled = false;
          }
        };
        head.append(text, label);
        card.append(head);
        if (k.geplant)
          card.append(
            node(
              "span",
              k.erledigt
                ? "\u{2713} Besuch erledigt"
                : "F\u{fc}r die Fahrt ausgew\u{e4}hlt",
              k.erledigt ? "pill done" : "pill",
            ),
          );
        const detail = node("details");
        detail.append(node("summary", "Kontakt, Lieferschein & Bearbeiten"));
        customerDetails(detail, k);
        documents(detail, k, t);
        const actions = node("div", undefined, "actions");
        if (address(k))
          actions.append(button("\u{1f4cd} Navigation", () => navigate(address(k))));
        actions.append(
          button("\u{270f}\u{fe0f} Bearbeiten", () => {
            page = "kunde";
            loadVersion++;
            $("title").textContent = "Kunde bearbeiten";
            customerForm(k, t);
          }),
        );
        if (k.geplant)
          actions.append(
            button(
              k.erledigt ? "\u{21a9} Wieder offen" : "\u{2713} Erledigt",
              async () => {
                await updateCustomer(k.id, { erledigt: !k.erledigt });
                await loadCustomers(t);
              },
            ),
          );
        actions.append(
          button(
            "L\u{f6}schen",
            async () => {
              if (!confirm('Kunde "' + k.name + '" wirklich l\u{f6}schen?')) return;
              const { data, error } = await supabaseClient
                .from("kunden")
                .delete()
                .eq("id", k.id)
                .select("id");
              if (error) throw error;
              if (!data?.length)
                throw new Error("Kunde konnte nicht gel\u{f6}scht werden.");
              await loadCustomers(t);
            },
            "danger",
          ),
        );
        detail.append(actions);
        card.append(detail);
        return card;
      }
      function customerDetails(c, k) {
        if (k.ansprechpartner) c.append(node("p", k.ansprechpartner));
        if (k.strasse)
          c.append(
            node(
              "p",
              [k.strasse, [k.plz, k.ort].filter(Boolean).join(" ")]
                .filter(Boolean)
                .join("\n"),
              "note",
            ),
          );
        if (k.telefon) {
          const p = node("p"),
            a = node("a", "\u{260e} " + k.telefon, "btn");
          a.href = "tel:" + k.telefon.replace(/[^+\d]/g, "");
          p.append(a);
          c.append(p);
        }
        if (k.notiz) c.append(node("p", k.notiz, "note"));
      }
      async function updateCustomer(id, change) {
        const { data, error } = await supabaseClient
          .from("kunden")
          .update(change)
          .eq("id", id)
          .select("id");
        if (error) throw error;
        if (!data?.length)
          throw new Error("\u{c4}nderung konnte nicht gespeichert werden.");
      }
      function renderDrive(t, c, selected) {
        const s = state(t),
          open = selected.filter((k) => !k.erledigt),
          next = open[0];
        const panel = node("section", undefined, "card current");
        panel.append(
          node("p", "Reihenfolge: alphabetisch. Google-Optimierung folgt.", "muted"),
        );
        if (selected.length) {
          const progress = node("progress", undefined, "progress");
          progress.max = selected.length;
          progress.value = selected.length - open.length;
          progress.setAttribute("aria-label", "Erledigte Besuche");
          panel.append(progress);
        }
        if (s.pause) {
          panel.append(
            node("h3", "\u{1f3e8} Tour pausiert"),
            node(
              "p",
              "Deine offenen Kunden bleiben ausgew\u{e4}hlt. Setze die Fahrt von deinem aktuellen Standort fort.",
            ),
          );
        } else if (!s.gestartet) {
          panel.append(
            node("h3", "Bereit f\u{fc}r die Fahrt?"),
            node(
              "p",
              "W\u{e4}hle in der Planung deine Kunden aus. Die Navigation startet von deinem aktuellen Standort.",
            ),
          );
        }
        if (next) {
          panel.append(
            node(
              "p",
              s.gestartet && !s.pause ? "N\u{e4}chster Kunde" : "Als N\u{e4}chstes",
              "muted",
            ),
            node("h3", next.name),
          );
          customerDetails(panel, next);
          documents(panel, next, t, true);
          const actions = node("div", undefined, "actions");
          if (!s.gestartet || s.pause) {
            actions.append(
              button(
                s.pause ? "\u{1f69a} Tour fortsetzen" : "\u{1f69a} Tour starten",
                async () => {
                  const a = address(next);
                  if (!a)
                    throw new Error(
                      "Bitte zuerst Stra\u{df}e und Ort dieses Kunden erg\u{e4}nzen.",
                    );
                  const tab = reserveMap();
                  s.gestartet = true;
                  s.pause = false;
                  saveState(t);
                  renderTour(t);
                  navigate(a, tab);
                },
                "primary",
              ),
            );
          } else {
            if (address(next))
              actions.append(
                button(
                  "\u{1f4cd} Navigation",
                  () => navigate(address(next)),
                  "primary",
                ),
              );
            else
              panel.append(
                node(
                  "p",
                  "F\u{fc}r die Navigation fehlen Stra\u{df}e oder Ort. In der Planung erg\u{e4}nzen.",
                  "alert",
                ),
              );
            actions.append(
              button(
                "\u{2713} Erledigt \u{b7} n\u{e4}chster Kunde",
                () => completeVisit(t, next),
                "success",
              ),
            );
          }
          panel.append(actions);
        } else if (!selected.length) {
          panel.append(
            node("p", "Noch keine Kunden f\u{fc}r die Fahrt ausgew\u{e4}hlt."),
            button(
              "Zur Planung",
              () => {
                views[t] = "planung";
                renderTour(t);
              },
              "primary",
            ),
          );
        } else {
          panel.append(
            node("h3", "\u{2713} Alle ausgew\u{e4}hlten Kunden erledigt"),
            button(
              "\u{1f3e0} Nach Hause navigieren",
              () => navigate(ZUHAUSE),
              "primary",
            ),
          );
        }
        const auto = node("input");
        auto.type = "checkbox";
        auto.checked = s.automatisch;
        auto.onchange = () => {
          s.automatisch = auto.checked;
          saveState(t);
        };
        const label = node("label", undefined, "check");
        label.append(
          auto,
          node(
            "span",
            "Nach \u{201e}Erledigt\u{201c} automatisch Navigation \u{f6}ffnen",
          ),
        );
        panel.append(label);
        c.append(panel);
        renderHotel(t, c);
        c.append(button("Tour zur\u{fc}cksetzen", () => resetTour(t), "danger"));
        if (open.length > 1) {
          const upcoming = node("details", undefined, "card");
          upcoming.append(
            node("summary", "Weitere offene Kunden (" + (open.length - 1) + ")"),
          );
          for (const k of open.slice(1)) {
            const row = node("div", undefined, "row");
            row.append(node("p", k.name));
            if (address(k))
              row.append(
                button("\u{1f4cd} Direkt hinfahren", () => navigate(address(k))),
              );
            upcoming.append(row);
          }
          upcoming.append(
            node(
              "p",
              "Direkte Navigation \u{e4}ndert die alphabetische Reihenfolge nicht.",
              "muted",
            ),
          );
          c.append(upcoming);
        }
      }
      async function completeVisit(t, k) {
        if (!confirm('Besuch bei "' + k.name + '" abschlie\u{df}en?')) return;
        const s = state(t),
          tab = s.automatisch ? reserveMap() : null;
        try {
          await updateCustomer(k.id, { erledigt: true });
          let latest;
          try {
            latest = await loadCustomers(t);
          } catch (e) {
            throw new Error(
              "Besuch gespeichert. N\u{e4}chster Kunde konnte nicht geladen werden: " +
                e.message,
            );
          }
          if (!latest) {
            if (tab) tab.close();
            return;
          }
          const next = latest.find((x) => x.geplant && !x.erledigt),
            a = next ? address(next) : ZUHAUSE;
          if (next && !a)
            throw new Error(
              "Besuch gespeichert. Beim n\u{e4}chsten Kunden fehlen Stra\u{df}e oder Ort.",
            );
          if (s.automatisch) navigate(a, tab);
        } catch (e) {
          if (tab) tab.close();
          throw e;
        }
      }
      function renderHotel(t, c) {
        const s = state(t),
          box = node("details", undefined, "card hotel");
        box.open = s.pause;
        box.append(node("summary", "\u{1f3e8} Hotel & Tagespause"));
        const label = node("label", "Hoteladresse"),
          input = node("input");
        input.type = "text";
        input.placeholder = "Stra\u{df}e, Hausnummer, PLZ und Ort";
        input.value = s.hotel;
        input.oninput = () => {
          s.hotel = input.value;
          saveState(t);
        };
        label.append(input);
        box.append(
          label,
          node(
            "p",
            "Du kannst das Hotel schon planen oder erst unterwegs eintragen.",
            "muted",
          ),
        );
        box.append(
          button(
            "\u{1f3e8} Zum Hotel fahren \u{b7} pausieren",
            () => {
              const a = input.value.trim();
              if (!a)
                throw new Error(
                  "Bitte die vollst\u{e4}ndige Hoteladresse eingeben.",
                );
              s.hotel = a;
              s.gestartet = true;
              s.pause = true;
              saveState(t);
              renderTour(t);
              navigate(a);
            },
            "primary",
          ),
        );
        box.append(
          button("\u{1f3e0} Nach Hause navigieren", () => navigate(ZUHAUSE)),
        );
        c.append(box);
      }
      function customerForm(k = null, defaultTour = "") {
        const form = node("form", undefined, "card form"),
          fields = {};
        for (const [id, title, type] of [
          ["name", "Firma / Name", "text"],
          ["ansprechpartner", "Ansprechpartner", "text"],
          ["strasse", "Stra\u{df}e und Hausnummer", "text"],
          ["plz", "PLZ", "text"],
          ["ort", "Ort", "text"],
          ["telefon", "Telefon", "tel"],
          ["tour", "Tour", "select"],
          ["notiz", "Notiz", "textarea"],
        ]) {
          const label = node("label", title);
          let input = node(
            type === "select"
              ? "select"
              : type === "textarea"
                ? "textarea"
                : "input",
          );
          if (type === "select") {
            for (const [value, text] of [
              ["", "Tour ausw\u{e4}hlen"],
              ...Object.entries(names),
            ]) {
              const o = node("option", text);
              o.value = value;
              input.append(o);
            }
          } else if (type === "textarea") input.rows = 4;
          else input.type = type;
          input.value = k?.[id] ?? (id === "tour" ? defaultTour : "");
          input.required = id === "name" || id === "tour";
          fields[id] = input;
          label.append(input);
          form.append(label);
        }
        const submit = node(
          "button",
          k ? "\u{1f4be} \u{c4}nderungen speichern" : "\u{1f4be} Kunde speichern",
          "primary",
        );
        submit.type = "submit";
        const msg = node("p", undefined, "muted");
        msg.setAttribute("role", "status");
        form.append(submit, msg);
        form.onsubmit = async (e) => {
          e.preventDefault();
          submit.disabled = true;
          try {
            const values = Object.fromEntries(
              Object.entries(fields).map(([key, input]) => [
                key,
                input.value.trim(),
              ]),
            );
            if (!values.name || !values.tour)
              throw new Error("Bitte Name und Tour eingeben.");
            if (k) await updateCustomer(k.id, values);
            else {
              const { error } = await supabaseClient.from("kunden").insert([values]);
              if (error) throw error;
            }
            views[values.tour] = "planung";
            await showPage(values.tour);
          } catch (err) {
            msg.textContent = "Speichern fehlgeschlagen: " + err.message;
          } finally {
            submit.disabled = false;
          }
        };
        $("content").replaceChildren(form);
      }
      function documents(container, k, t, compact = false) {
        const box = node("div", undefined, "document"),
          msg = node(
            "p",
            k.lieferschein_pfad
              ? "\u{1f4c4} Lieferschein hinterlegt"
              : "Noch kein Lieferschein hinterlegt.",
            "muted",
          );
        msg.setAttribute("role", "status");
        box.append(msg);
        if (k.lieferschein_pfad)
          box.append(
            button("\u{1f4c4} Lieferschein \u{f6}ffnen", async () => {
              const tab = window.open("about:blank", "_blank");
              if (tab) tab.opener = null;
              try {
                const { data, error } = await supabaseClient.storage
                  .from("lieferschein")
                  .createSignedUrl(k.lieferschein_pfad, 600);
                if (error) throw error;
                if (tab && !tab.closed) tab.location.replace(data.signedUrl);
                else {
                  const a = node("a", "Lieferschein hier \u{f6}ffnen", "btn");
                  a.href = data.signedUrl;
                  a.target = "_blank";
                  a.rel = "noopener noreferrer";
                  msg.replaceChildren(a);
                }
              } catch (e) {
                if (tab) tab.close();
                msg.textContent = "\u{d6}ffnen fehlgeschlagen: " + e.message;
              }
            }),
          );
        const uploadArea = node("details");
        uploadArea.append(
          node(
            "summary",
            k.lieferschein_pfad ? "Lieferschein ersetzen" : "Lieferschein hochladen",
          ),
        );
        const file = node("input");
        file.type = "file";
        file.accept = ".pdf,.jpg,.jpeg,.png,.webp";
        file.setAttribute(
          "aria-label",
          "Lieferschein f\u{fc}r " + k.name + " ausw\u{e4}hlen",
        );
        const hint = node("p", "PDF, JPG, PNG oder WebP \u{b7} bis 10 MB", "muted");
        const upload = button("\u{1f4e4} Hochladen", async () => {
          const f = file.files[0],
            types = {
              pdf: "application/pdf",
              jpg: "image/jpeg",
              jpeg: "image/jpeg",
              png: "image/png",
              webp: "image/webp",
            };
          if (!f) throw new Error("Bitte zuerst eine Datei ausw\u{e4}hlen.");
          const ext = f.name.split(".").pop().toLowerCase();
          if (!Object.hasOwn(types, ext))
            throw new Error("Bitte PDF, JPG, PNG oder WebP ausw\u{e4}hlen.");
          if (!f.size || f.size > 10 * 1024 * 1024)
            throw new Error(
              "Bitte eine nicht leere Datei bis 10 MB ausw\u{e4}hlen.",
            );
          if (
            k.lieferschein_pfad &&
            !confirm("Den hinterlegten Lieferschein ersetzen?")
          )
            return;
          file.disabled = true;
          msg.textContent = "Lieferschein wird hochgeladen \u{2026}";
          try {
            const { data: auth, error: ae } = await supabaseClient.auth.getUser();
            if (ae) throw ae;
            if (!auth.user) throw new Error("Bitte anmelden.");
            const path =
              auth.user.id + "/" + k.id + "/" + crypto.randomUUID() + "." + ext;
            const { error } = await supabaseClient.storage
              .from("lieferschein")
              .upload(path, f, { contentType: types[ext], upsert: false });
            if (error) throw error;
            await updateCustomer(k.id, { lieferschein_pfad: path });
            k.lieferschein_pfad = path;
            if (page === t && userId === auth.user.id) renderTour(t);
          } catch (e) {
            msg.textContent = "Hochladen fehlgeschlagen: " + e.message;
          } finally {
            file.disabled = false;
          }
        });
        uploadArea.append(file, hint, upload);
        box.append(uploadArea);
        container.append(box);
      }

      async function resetTour(t) {
        if (
          !confirm(
            names[t] +
              " zur\u{fc}cksetzen?\n\n" +
              "Alle Kundenauswahlen und Erledigt-Markierungen dieser Tour werden zur\u{fc}ckgesetzt.\n\n" +
              "Kundendaten und Lieferscheine bleiben erhalten.",
          )
        )
          return;
        if (
          !confirm(
            "Sind Sie wirklich sicher?\n\n" +
              "Die bisherige Besuchsmarkierung wird gel\u{f6}scht. Die n\u{e4}chste Tour kann danach neu geplant werden.",
          )
        )
          return;
        const { data, error } = await supabaseClient
          .from("kunden")
          .update({ geplant: false, erledigt: false })
          .eq("tour", t)
          .select("id");
        if (error) throw error;
        if (rows.length > 0 && !data?.length) {
          throw new Error("Die Tour konnte nicht zur\u{fc}ckgesetzt werden.");
        }
        const s = state(t);
        s.gestartet = false;
        s.pause = false;
        s.hotel = "";
        saveState(t);
        views[t] = "planung";
        await loadCustomers(t);
      }
    </script>
  </body>
</html>
