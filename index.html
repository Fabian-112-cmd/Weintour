function customerCard(k,t) {const card=node("article",undefined,"customer");const head=node("div",undefined,"customer-head");const text=node("div");text.append(node("strong",k.name||"Ohne Name"),node("p",[k.plz,k.ort].filter(Boolean).join(" ")||"Ort noch nicht hinterlegt","muted"));const check=node("input");check.type="checkbox";check.checked=!!k.geplant;const label=node("label",undefined,"check");label.append(check,node("span","Auswahl"));check.setAttribute("aria-label",k.name+" fÃ¼r die Fahrt auswÃ¤hlen");check.onchange=async()=>{check.disabled=true;try{await updateCustomer(k.id,{geplant:check.checked,erledigt:false});await loadCustomers(t);}catch(e){check.checked=!check.checked;alert(e.message);}finally{check.disabled=false;}};head.append(text,label);card.append(head);if(k.geplant)card.append(node("span",k.erledigt?"âœ“ Besuch erledigt":"FÃ¼r die Fahrt ausgewÃ¤hlt",k.erledigt?"pill done":"pill"));const detail=node("details");detail.append(node("summary","Kontakt, Lieferschein & Bearbeiten"));customerDetails(detail,k);documents(detail,k,t);const actions=node("div",undefined,"actions");if(address(k))actions.append(button("ðŸ“ Navigation",()=>navigate(address(k))));actions.append(button("âœï¸ Bearbeiten",()=>{page="kunde";loadVersion++;$("title").textContent="Kunde bearbeiten";customerForm(k,t);}));if(k.geplant)actions.append(button(k.erledigt?"â†© Wieder offen":"âœ“ Erledigt",async()=>{await updateCustomer(k.id,{erledigt:!k.erledigt});await loadCustomers(t);}));actions.append(button("LÃ¶schen",async()=>{if(!confirm('Kunde "'+k.name+'" wirklich lÃ¶schen?'))return;const {data,error}=await supabaseClient.from("kunden").delete().eq("id",k.id).select("id");if(error)throw error;if(!data?.length)throw new Error("Kunde konnte nicht gelÃ¶scht werden.");await loadCustomers(t);},"danger"));detail.append(actions);card.append(detail);return card;}

function customerForm(k=null,defaultTour="") {const form=node("form",undefined,"card form"),fields={};for(const [id,title,type]of [["name","Firma / Name","text"],["ansprechpartner","Ansprechpartner","text"],["strasse","StraÃŸe und Hausnummer","text"],["plz","PLZ","text"],["ort","Ort","text"],["telefon","Telefon","tel"],["tour","Tour","select"],["notiz","Notiz","textarea"]]){const label=node("label",title);let input=node(type==="select"?"select":type==="textarea"?"textarea":"input");if(type==="select"){for(const [value,text]of [["","Tour auswÃ¤hlen"],...Object.entries(names)]){const o=node("option",text);o.value=value;input.append(o);}}else if(type==="textarea")input.rows=4;else input.type=type;input.value=k?.[id]??(id==="tour"?defaultTour:"");input.required=id==="name"||id==="tour";fields[id]=input;label.append(input);form.append(label);}const submit=node("button",k?"ðŸ’¾ Ã„nderungen speichern":"ðŸ’¾ Kunde speichern","primary");submit.type="submit";const msg=node("p",undefined,"muted");msg.setAttribute("role","status");form.append(submit,msg);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{const values=Object.fromEntries(Object.entries(fields).map(([key,input])=>[key,input.value.trim()]));if(!values.name||!values.tour)throw new Error("Bitte Name und Tour eingeben.");if(k)await updateCustomer(k.id,values);else{const {error}=await supabaseClient.from("kunden").insert([values]);if(error)throw error;}views[values.tour]="planung";await showPage(values.tour);}catch(err){msg.textContent="Speichern fehlgeschlagen: "+err.message;}finally{submit.disabled=false;}};$("content").replaceChildren(form);}
