<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f3f7" />
    <title>Weintour</title>
<link rel="icon" type="image/png" href="weintour-logo.png">
<link rel="apple-touch-icon" href="weintour-logo.png">
    <!-- DARSTELLUNG: Farben, Abstaende und mobile Ansicht -->
    <style>
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      :root {
        --purple: #643985;
        --ink: #292333;
        --muted: #756d7e;
        --line: #e6dfea;
        --green: #236840;
      }
      body {
        margin: 0;
        background: #f5f3f7;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        max-width: 780px;
        margin: auto;
        padding: 24px 16px 48px;
      }
      header,
      .row,
      .actions,
      .tabs {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      header {
        justify-content: space-between;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 30px;
        margin: 0;
      }
      h2 {
        margin: 0 0 16px;
      }
      h3 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        line-height: 1.5;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      .btn {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 15px;
        background: white;
        color: var(--ink);
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        min-height: 44px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 3px solid #bda1d1;
        outline-offset: 3px;
      }
      .primary {
        background: var(--purple);
        color: white;
        border-color: var(--purple);
        font-weight: 700;
      }
      .success {
        background: var(--green);
        border-color: var(--green);
        color: white;
        font-weight: 700;
      }
      .danger {
        color: #a83232;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 18px;
        border: 1px solid var(--line);
        margin-bottom: 16px;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .menu {
        width: 100%;
        text-align: left;
        padding: 20px;
        margin-bottom: 12px;
        border-radius: 18px;
      }
      .menu strong {
        font-size: 21px;
      }
      .menu small {
        display: block;
        margin-top: 7px;
        color: var(--muted);
        line-height: 1.5;
      }
      input:not([type="checkbox"]):not([type="file"]),
      select,
      textarea {
        width: 100%;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: white;
        color: var(--ink);
        font-size: 16px;
      }
      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: var(--purple);
        flex-shrink: 0;
      }
      input[type="file"] {
        max-width: 100%;
        font-size: 14px;
      }
      .form {
        display: grid;
        gap: 14px;
      }
      .form label {
        display: grid;
        gap: 7px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 12px 0;
        line-height: 1.5;
      }
      .tabs {
        margin-bottom: 18px;
      }
      .tabs button {
        flex: 1;
      }
      .tabs button[aria-selected="true"] {
        background: var(--purple);
        color: white;
        border-color: var(--purple);
      }
      .stats {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0 20px;
      }
      .pill {
        background: #f0eaf5;
        border-radius: 20px;
        padding: 6px 11px;
        font-size: 13px;
      }
      .pill.done {
        background: #e7f2ea;
        color: var(--green);
      }
      .customer {
        padding: 16px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 15px;
        margin-bottom: 12px;
      }
      .customer-head {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 10px;
      }
      .customer-head strong {
        font-size: 18px;
      }
      .customer .check {
        margin: 0;
      }
      .customer summary,
      summary {
        cursor: pointer;
        min-height: 44px;
        display: flex;
        align-items: center;
        font-weight: 600;
      }
      .customer details {
        border-top: 1px solid var(--line);
        margin-top: 12px;
      }
      .note {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .current {
        border: 2px solid #c6add8;
      }
      .current h3 {
        font-size: 27px;
      }
      .current .actions > * {
        flex: 1;
        text-align: center;
      }
      .load-info {
        display: table;
        max-width: 100%;
        margin: 8px 0 12px;
        padding: 5px 9px;
        border-radius: 8px;
        background: #f5f3f7;
        font-size: 14px;
        line-height: 1.5;
      }
      .customer-phone { margin: 6px 0 10px; }
      .customer-phone a { font-weight: 600; }
      .document {
        margin: 12px 0;
        padding: 8px 10px;
        background: #f5f3f7;
        border-radius: 10px;
      }
      .document-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 10px;
        font-size: 14px;
      }
      .document-row button {
        min-height: 36px;
        padding: 6px 10px;
        font-size: 14px;
        width: auto;
      }
      .document-status { margin-right: auto; }
      .document p { margin: 8px 0; }
      .document-upload {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .document-upload input { max-width: 100%; }
      .delivery-item { padding: 12px 0; border-top: 1px solid var(--line); }
      .hotel {
        margin-top: 18px;
      }
      .hotel summary {
        gap: 8px;
      }
      .alert {
        color: #a83232;
      }
      .progress {
        width: 100%;
        height: 9px;
        accent-color: var(--purple);
      }
      .empty {
        text-align: center;
        padding: 24px;
        color: var(--muted);
      }
      @media (max-width: 480px) {
        .wrap {
          padding: 18px 12px 36px;
        }
        .card {
          padding: 16px;
        }
        h1 {
          font-size: 26px;
        }
        .actions button,
        .actions .btn {
          flex-grow: 1;
          text-align: center;
        }
        .current .actions {
          display: grid;
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- OBERFLAECHE: Anmeldung, Startseite und Touransicht -->
    <main class="wrap">
      <header>
        <h1 style="display:flex;align-items:center;gap:12px;"><img src="weintour-logo.png" alt="" width="48" height="48" style="border-radius:12px;">Weintour</h1>
        <button id="logout" hidden>Abmelden</button>
      </header>
      <section id="login" class="card">
        <h2>Anmelden</h2>
        <form id="loginForm" class="form">
          <label
            >Benutzername<input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required
          /></label>
          <label
            >Passwort<input
              id="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <button class="primary" type="submit">Anmelden</button>
          <p id="loginMessage" role="status"></p>
        </form>
      </section>
      <div id="app" hidden>
        <section id="home">
          <button class="menu" data-page="kunde">
            <strong>&#10133; Kunde anlegen</strong
            >
          </button>
          <button class="menu" data-page="muenchen">
            <strong>&#128666; M&#252;nchen-Tour</strong
            >
          </button>
          <button class="menu" data-page="berlin">
            <strong>&#128666; Berlin-Tour</strong
            >
          </button>
        </section>
        <section id="page" hidden>
          <button id="back">&#8592; &#220;bersicht</button>
          <h2 id="title" style="margin-top: 20px"></h2>
          <div id="content"></div>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const supabaseClient = supabase.createClient(
        "https://grrkvuqxjglfuynmxegv.supabase.co",
        "sb_publishable_5P58BQr8tEksRLUqb8vmOg_uEM_MA24",
      );
      const ZUHAUSE =
        "Kaiserbachstra\u{df}e 20, 76831 Heuchelheim-Klingen, Deutschland";
      const $ = (id) => document.getElementById(id);
      const names = { muenchen: "M\u{fc}nchen-Tour", berlin: "Berlin-Tour" };
      let userId = null,
        page = null,
        rows = [],
        loadVersion = 0;
      const states = {},
        views = {},
        searches = {},
        filters = {};
      // ============================================================
      // HILFSFUNKTIONEN: sichere Texte und Schaltflaechen
      // ============================================================
      function node(tag, text, cls) {
        const e = document.createElement(tag);
        if (text !== undefined) e.textContent = text;
        if (cls) e.className = cls;
        return e;
      }
      function button(text, action, cls = "") {
        const b = node("button", text, cls);
        b.type = "button";
        b.onclick = async () => {
          b.disabled = true;
          try {
            await action();
          } catch (e) {
            alert(e.message);
          } finally {
            b.disabled = false;
          }
        };
        return b;
      }
      // ============================================================
      // ADRESSEN UND GESPEICHERTER TOURSTATUS
      // ============================================================
      function address(k) {
        return k.strasse && k.ort
          ? [k.strasse, k.plz, k.ort, "Deutschland"].filter(Boolean).join(", ")
          : "";
      }
      function state(t) {
        if (!states[t]) {
          let s = {};
          try {
            s =
              JSON.parse(
                sessionStorage.getItem("weintour-steuerung-" + userId + "-" + t),
              ) || {};
          } catch {}
          states[t] = {
            gestartet: s.gestartet === true,
            pause: s.pause === true,
            hotel: typeof s.hotel === "string" ? s.hotel : "",
            automatisch: s.automatisch !== false,
          };
        }
        return states[t];
      }
      function saveState(t) {
        try {
          sessionStorage.setItem(
            "weintour-steuerung-" + userId + "-" + t,
            JSON.stringify(state(t)),
          );
        } catch {}
      }
      // ============================================================
      // GOOGLE-MAPS-NAVIGATION
      // ============================================================
      function mobile() {
        return (
          /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }
      function reserveMap() {
        if (mobile()) return null;
        const tab = window.open("about:blank", "_blank");
        if (tab) tab.opener = null;
        return tab;
      }
      function navigate(a, tab = null) {
        const url =
          "https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=" +
          encodeURIComponent(a);
        if (tab && !tab.closed) {
          tab.location.replace(url);
        } else if (mobile()) {
          window.location.assign(url);
        } else {
          const link = node("a");
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          document.body.append(link);
          link.click();
          link.remove();
        }
      }
      // ============================================================
      // ANMELDUNG UND SEITENWECHSEL
      // ============================================================
      function showHome() {
        loadVersion++;
        page = null;
        $("home").hidden = false;
        $("page").hidden = true;
        $("content").replaceChildren();
      }
      function setAuth(session) {
        const next = session?.user.id || null;
        if (next !== userId) {
          userId = next;
          rows = [];
          for (const obj of [states, views, searches, filters])
            for (const k of Object.keys(obj)) delete obj[k];
          showHome();
        }
        $("login").hidden = !!session;
        $("app").hidden = !session;
        $("logout").hidden = !session;
      }
      function loginAdresse(eingabe) {
        const name = eingabe.trim().toLowerCase();
        if (name.includes("@")) return name;
        if (name === "weintour") return "fabian-112@t-online.de";
        if (!/^[a-z0-9][a-z0-9._-]{1,39}$/.test(name)) {
          throw new Error("Bitte einen Benutzernamen mit 2 bis 40 Zeichen eingeben (Buchstaben, Zahlen, Punkt, Unterstrich oder Bindestrich).");
        }
        return name + "@weintour.example.com";
      }
      $("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const b = e.target.querySelector("button");
        b.disabled = true;
        $("loginMessage").textContent = "Anmeldung l\u{e4}uft \u{2026}";
        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: loginAdresse($("username").value),
            password: $("password").value,
          });
          if (error) throw error;
          $("password").value = "";
          $("loginMessage").textContent = "";
          setAuth(data.session);
        } catch (err) {
          $("loginMessage").textContent = "Anmeldung fehlgeschlagen: " + err.message;
        } finally {
          b.disabled = false;
        }
      };
      $("logout").onclick = async () => {
        const { error } = await supabaseClient.auth.signOut({ scope: "local" });
        if (error) {
          alert(error.message);
          return;
        }
        window.location.reload();
      };
      supabaseClient.auth.onAuthStateChange((_event, session) => setAuth(session));
      supabaseClient.auth.getSession().then(({ data, error }) => {
        if (error) $("loginMessage").textContent = error.message;
        else setAuth(data.session);
      });
      $("back").onclick = showHome;
      document
        .querySelectorAll("[data-page]")
        .forEach((b) => (b.onclick = () => showPage(b.dataset.page)));
      async function showPage(t) {
        if (!userId) return;
        page = t;
        $("home").hidden = true;
        $("page").hidden = false;
        $("title").textContent = names[t] || "Kunde anlegen";
        if (t === "kunde") {
          loadVersion++;
          customerForm();
          return;
        }
        if (!views[t]) views[t] = state(t).gestartet ? "fahrt" : "planung";
        try {
          await loadCustomers(t);
        } catch (e) {
          $("content").replaceChildren(
            node("p", "Laden fehlgeschlagen: " + e.message, "alert"),
            button("Erneut versuchen", () => showPage(t)),
          );
        }
      }
      // ============================================================
      // KUNDEN LADEN UND TOURANSICHT
      // ============================================================
      // Kartonnummern werden abschnittsweise sortiert: 4, 4.1, 4.2, 4.10, 5.
      function nummerGueltig(value) {
        return /^[1-9]\d*(?:\.[1-9]\d*)?$/.test(String(value ?? ""));
      }
      function nummerVergleich(a, b) {
        const x = String(a.kartonnummer || "").split(".").map(Number);
        const y = String(b.kartonnummer || "").split(".").map(Number);
        if (!a.kartonnummer) return b.kartonnummer ? 1 : Number(a.id) - Number(b.id);
        if (!b.kartonnummer) return -1;
        for (let i = 0; i < Math.max(x.length, y.length); i++) {
          if (i >= x.length) return -1;
          if (i >= y.length) return 1;
          if (x[i] !== y[i]) return x[i] - y[i];
        }
        return Number(a.id) - Number(b.id);
      }
      function lieferStopps(kunden) {
        const gruppen = new Map();
        for (const kunde of kunden.filter(k => k.geplant && !k.erledigt)) {
          const host = kunde.abgeben_bei_id
            ? kunden.find(k => String(k.id) === String(kunde.abgeben_bei_id))
            : kunde;
          if (!host) throw new Error("Abgabeadresse fehlt bei " + kunde.name);
          const key = String(host.id);
          if (!gruppen.has(key)) gruppen.set(key, { host, lieferungen: [] });
          gruppen.get(key).lieferungen.push(kunde);
        }
        const stops = [...gruppen.values()];
        for (const stop of stops) stop.lieferungen.sort(nummerVergleich);
        return stops.sort((a, b) => nummerVergleich(a.lieferungen[0], b.lieferungen[0]));
      }
      async function loadCustomers(t) {
        const version = ++loadVersion,
          uid = userId;
        const { data, error } = await supabaseClient
          .from("kunden")
          .select("*")
          .eq("tour", t)
          .order("kartonnummer", { ascending: true, nullsFirst: false })
          .order("id", { ascending: true });
        if (error) throw error;
        if (version !== loadVersion || page !== t || uid !== userId) return null;
        rows = (data || []).sort(nummerVergleich);
        renderTour(t);
        return rows;
      }
      function renderTour(t) {
        if (page !== t || !userId) return;
        const c = $("content");
        c.replaceChildren();
        const tabs = node("div", undefined, "tabs");
        tabs.setAttribute("role", "tablist");
        for (const [v, label] of [
          ["planung", "\u{1f4cb} Planung"],
          ["fahrt", "\u{1f69a} Aktive Tour"],
        ]) {
          const b = button(label, () => {
            views[t] = v;
            renderTour(t);
          });
          b.setAttribute("role", "tab");
          b.setAttribute("aria-selected", String(views[t] === v));
          tabs.append(b);
        }
        c.append(tabs);
        const selected = rows.filter((k) => k.geplant),
          done = selected.filter((k) => k.erledigt).length;
        const stats = node("div", undefined, "stats");
        for (const text of [
          selected.length + " ausgew\u{e4}hlt",
          selected.length - done + " offen",
          done + " erledigt",
        ])
          stats.append(node("span", text, "pill"));
        c.append(stats);
        if (selected.length) {
          const summe = selected.reduce((sum, k) => sum + (Number(k.paketanzahl) || 0), 0);
          const fehlen = selected.filter(k => k.paketanzahl == null).length;
          c.append(node("p", summe + " Pakete fuer die ausgewaehlte Tour" +
            (fehlen ? " (bei " + fehlen + " Kunden fehlt noch die Anzahl)" : ""), "muted"));
        }
        if (views[t] === "planung") renderPlan(t, c);
        else renderDrive(t, c, selected);
      }
      // ============================================================
      // PLANUNG: Suche, Filter und Kundenauswahl
      // ============================================================
      function renderPlan(t, c) {
        const tools = node("div", undefined, "card form");
        const search = node("input");
        search.type = "search";
        search.placeholder = "Kunde, Ort oder PLZ suchen";
        search.setAttribute("aria-label", "Kunden suchen");
        search.value = searches[t] || "";
        const filter = node("select");
        filter.setAttribute("aria-label", "Kunden filtern");
        for (const [value, text] of [
          ["alle", "Alle Kunden"],
          ["auswahl", "Nur ausgew\u{e4}hlte Kunden"],
          ["offen", "Ausgew\u{e4}hlte, offene Kunden"],
          ["erledigt", "Ausgew\u{e4}hlte, erledigte Kunden"],
        ]) {
          const o = node("option", text);
          o.value = value;
          filter.append(o);
        }
        filter.value = filters[t] || "alle";
        tools.append(
          search,
          filter,
          button("\u{2795} Kunde anlegen", () => {
            page = "kunde";
            loadVersion++;
            $("title").textContent = "Kunde anlegen";
            customerForm(null, t);
          }),
        );
        c.append(tools);
        const list = node("div");
        c.append(list);
        function draw() {
          list.replaceChildren();
          const q = search.value.trim().toLocaleLowerCase("de");
          const found = rows
            .filter((k) =>
              [k.name, k.ansprechpartner, k.ort, k.plz, k.strasse]
                .filter(Boolean)
                .join(" ")
                .toLocaleLowerCase("de")
                .includes(q),
            )
            .filter(
              (k) =>
                filter.value === "alle" ||
                (k.geplant &&
                  (filter.value === "auswahl" ||
                    (filter.value === "offen" ? !k.erledigt : k.erledigt))),
            );
          if (!found.length)
            list.append(
              node(
                "p",
                rows.length
                  ? "Keine passenden Kunden gefunden."
                  : "Noch keine Kunden gespeichert.",
                "empty",
              ),
            );
          for (const k of found) list.append(customerCard(k, t));
        }
        search.oninput = () => {
          searches[t] = search.value;
          draw();
        };
        filter.onchange = () => {
          filters[t] = filter.value;
          draw();
        };
        draw();
      }
      // ============================================================
      // KUNDENKARTEN: Kontakt, Bearbeiten und Loeschen
      // ============================================================
      function customerCard(k, t) {
        const card = node("article", undefined, "customer");
        const head = node("div", undefined, "customer-head");
        const text = node("div");
        text.append(
          node("strong", k.name || "Ohne Name"),
          node(
            "p",
            [k.plz, k.ort].filter(Boolean).join(" ") || "Ort noch nicht hinterlegt",
            "muted",
          ),
        );
        const check = node("input");
        check.type = "checkbox";
        check.checked = !!k.geplant;
        const label = node("label", undefined, "check");
        label.append(check, node("span", "Auswahl"));
        check.setAttribute(
          "aria-label",
          k.name + " f\u{fc}r die Fahrt ausw\u{e4}hlen",
        );
        check.onchange = async () => {
          check.disabled = true;
          try {
            if (check.checked) pruefeBeladung(k);
            await updateCustomer(k.id, { geplant: check.checked, erledigt: false });
            await loadCustomers(t);
          } catch (e) {
            check.checked = !check.checked;
            alert(e.message);
          } finally {
            check.disabled = false;
          }
        };
        head.append(text, label);
        card.append(head);
        if (k.abgeben_bei_id) {
          const host = rows.find(x => String(x.id) === String(k.abgeben_bei_id));
          card.append(node("p", "Abgeben bei: " + (host?.name || "Zuordnung pr\u{fc}fen"), "muted"));
        }

      const lagerorte = { L: "Links", R: "Rechts", H: "Hinten", A: "H\u{e4}nger" };
      // Beladeangaben sind fuer ausgewaehlte Kunden Pflicht.
      // Ein Lieferschein bleibt freiwillig.
      function pruefeBeladung(k) {
        const fehlt = [];
        if (!nummerGueltig(k.kartonnummer))
          fehlt.push("Kartonnummer");
        if (!Number.isInteger(k.paketanzahl) || k.paketanzahl < 0 || k.paketanzahl > 100000)
          fehlt.push("Paketanzahl");
        if (!Object.hasOwn(lagerorte, k.lagerort || "")) fehlt.push("Lagerort");
        if (fehlt.length) throw new Error(
          (k.name || "Dieser Kunde") + ": Es fehlen g\u{fc}ltige Angaben f\u{fc}r " +
          fehlt.join(", ") + ". Bitte unter Bearbeiten erg\u{e4}nzen und danach ausw\u{e4}hlen."
        );
      }
      function paketInfo(k) {
        const teile = [];
        if (k.kartonnummer != null) teile.push("Kartonnummer: " + k.kartonnummer);
        if (k.paketanzahl != null) teile.push(k.paketanzahl + " Pakete");
        if (k.lagerort) teile.push("Lagerort: " + (lagerorte[k.lagerort] || k.lagerort));
        return teile.join(" \u{b7} ");
      }
      function customerDetails(c, k) {

          p.append(a);
          c.append(p);

        if (paketInfo(k)) c.append(node("p", paketInfo(k), "load-info"));
        if (k.ansprechpartner) c.append(node("p", k.ansprechpartner));
        if (k.strasse)

              "p",

        if (k.notiz) c.append(node("p", k.notiz, "note"));

          besuch.append(node("strong", "Letzter Besuch: " +

      // ============================================================
      // BESUCH ABSCHLIESSEN UND WEITERFAHREN
      // ============================================================
      async function completeVisit(t, k, notiz = "") {
        const stopp = lieferStopps(rows).find(s => String(s.host.id) === String(k.id));
        if (!stopp) throw new Error("Dieser Lieferstopp ist nicht mehr offen.");
        if (!confirm('Stopp bei "' + k.name + '" abschlie\u{df}en? Alle ' + stopp.lieferungen.length + ' Lieferungen werden erledigt und ihre Lieferscheine archiviert.')) return;
        const s = state(t),
          tab = s.automatisch ? reserveMap() : null;
        try {
          const ids = stopp.lieferungen.map(l => l.id);
          const { data: gespeichert, error: speicherFehler } = await supabaseClient
            .from("kunden")
            .update({ erledigt: true, lieferschein_pfad: null, letzter_besuch: new Date().toISOString(), besuchsnotiz: notiz.trim() })
            .in("id", ids).eq("tour", t).select("id");
          if (speicherFehler) throw speicherFehler;
          if (gespeichert?.length !== ids.length) throw new Error("Nicht alle Lieferungen konnten gespeichert werden. Bitte neu laden und kontrollieren.");
          let latest;
          try {
            latest = await loadCustomers(t);
          } catch (e) {
            throw new Error(
              "Besuch gespeichert. N\u{e4}chster Kunde konnte nicht geladen werden: " +
                e.message,
            );
          }
          if (!latest) {
            if (tab) tab.close();
            return;
          }
          const next = lieferStopps(latest)[0]?.host,
            a = next ? address(next) : ZUHAUSE;
          if (next && !a)
            throw new Error(
              "Besuch gespeichert. Beim n\u{e4}chsten Kunden fehlen Stra\u{df}e oder Ort.",
            );
          if (s.automatisch) navigate(a, tab);
        } catch (e) {
          if (tab) tab.close();
          throw e;
        }
      }

      // ============================================================
      // KUNDEN ANLEGEN UND BEARBEITEN
      // ============================================================
      function customerForm(k = null, defaultTour = "") {
        const form = node("form", undefined, "card form"),
          fields = {};
        for (const [id, title, type] of [
          ["name", "Firma / Name", "text"],
          ["ansprechpartner", "Ansprechpartner", "text"],
          ["strasse", "Stra\u{df}e und Hausnummer", "text"],
          ["plz", "PLZ", "text"],
          ["ort", "Ort", "text"],
          ["telefon", "Telefon", "tel"],
          ["tour", "Tour", "select"],
          ["kartonnummer", "Kartonnummer (z. B. 4 oder 4.1)", "text"],
          ["abgeben_bei_id", "Abgeben bei", "select"],
          ["paketanzahl", "Paketanzahl / Kartonanzahl", "number"],
          ["lagerort", "Lagerort im Fahrzeug", "select"],
          ["notiz", "Notiz", "textarea"],
        ]) {
          const label = node("label", title);
          let input = node(
            type === "select"
              ? "select"
              : type === "textarea"
                ? "textarea"
                : "input",
          );
          if (type === "select") {
            const optionen = id === "abgeben_bei_id"
              ? [["", "Eigene Lieferadresse"], ...rows.filter(x => String(x.id) !== String(k?.id) && !x.abgeben_bei_id && x.tour === (k?.tour || defaultTour)).map(x => [String(x.id), x.name])]
              : id === "lagerort"
              ? [["", "Noch nicht zugeordnet"], ...Object.entries(lagerorte)]
              : [["", "Tour ausw\u{e4}hlen"], ...Object.entries(names)];
            for (const [value, text] of optionen) {
              const o = node("option", text);
              o.value = value;
              input.append(o);
            }
          } else if (type === "textarea") input.rows = 4;
          else input.type = type;
          input.value = k?.[id] ?? (id === "tour" ? defaultTour : "");
          input.required = id === "name" || id === "tour";
          if (id === "paketanzahl" || id === "kartonnummer") {
            input.min = id === "kartonnummer" ? "1" : "0";
            input.max = "100000";
            input.step = "1";
            input.inputMode = "numeric";
            input.placeholder = id === "kartonnummer" ? "Zum Beispiel 4.1" : "Noch nicht eingetragen";
            if (id === "kartonnummer") { input.inputMode = "decimal"; input.pattern = "[1-9][0-9]*(\\.[1-9][0-9]*)?"; }
          }
          fields[id] = input;
          label.append(input);
          form.append(label);
        }
        const submit = node(
          "button",
          k ? "\u{1f4be} \u{c4}nderungen speichern" : "\u{1f4be} Kunde speichern",
          "primary",
        );
        submit.type = "submit";
        const msg = node("p", undefined, "muted");
        msg.setAttribute("role", "status");
        form.append(submit, msg);
        form.onsubmit = async (e) => {
          e.preventDefault();
          submit.disabled = true;
          try {
            const values = Object.fromEntries(
              Object.entries(fields).map(([key, input]) => [
                key,
                input.value.trim(),
              ]),
            );
            if (!values.name || !values.tour)
              throw new Error("Bitte Name und Tour eingeben.");
            values.kartonnummer = values.kartonnummer === "" ? null : values.kartonnummer.replace(",", ".");
            if (values.kartonnummer !== null && !nummerGueltig(values.kartonnummer))
              throw new Error("Bitte eine Kartonnummer wie 4 oder 4.1 eingeben.");
            values.abgeben_bei_id = values.abgeben_bei_id || null;
            if (values.abgeben_bei_id) {
              const host = rows.find(x => String(x.id) === values.abgeben_bei_id);
              if (!host || host.tour !== values.tour || host.abgeben_bei_id || String(host.id) === String(k?.id))
                throw new Error("Bitte einen Kunden derselben Tour mit eigener Lieferadresse ausw\u{e4}hlen.");
              if (k && rows.some(x => String(x.abgeben_bei_id) === String(k.id)))
                throw new Error("Diesem Kunden sind bereits Lieferungen zugeordnet. Er muss eine eigene Abgabeadresse behalten.");
            }
            values.paketanzahl = values.paketanzahl === "" ? null : Number(values.paketanzahl);
            if (values.paketanzahl !== null && (!Number.isInteger(values.paketanzahl) ||
                values.paketanzahl < 0 || values.paketanzahl > 100000))
              throw new Error("Bitte eine ganze Paketanzahl zwischen 0 und 100000 eingeben.");
            if (values.lagerort && !Object.hasOwn(lagerorte, values.lagerort))
              throw new Error("Bitte einen Lagerort aus der Liste auswaehlen.");
            if (k && values.tour !== k.tour && rows.some(x => String(x.abgeben_bei_id) === String(k.id)))
              throw new Error("Bitte zuerst die zugeordneten Lieferungen entfernen, bevor die Tour dieser Abgabeadresse geaendert wird.");
            if (k?.geplant && !k.erledigt) pruefeBeladung(values);
            if (k) await updateCustomer(k.id, values);
            else {
              const { error } = await supabaseClient.from("kunden").insert([values]);
              if (error) throw error;
            }
            views[values.tour] = "planung";
            await showPage(values.tour);
          } catch (err) {
            msg.textContent = "Speichern fehlgeschlagen: " + err.message;
          } finally {
            submit.disabled = false;
          }
        };
        $("content").replaceChildren(form);
      }
      // ============================================================
      // LIEFERSCHEINE: Hochladen und Oeffnen
      // ============================================================
      function documents(container, k, t, compact = false) {
        const box = node("div", undefined, "document");
        const row = node("div", undefined, "document-row");
        const status = node("span", k.lieferschein_pfad
          ? "\u{1f4c4} Lieferschein vorhanden"

        msg.setAttribute("role", "status");
        msg.hidden = true;
        row.append(status);
        box.append(row, msg);
        if (k.lieferschein_pfad)
          row.append(
            button("\u{f6}ffnen", async () => {
              const tab = window.open("about:blank", "_blank");
              if (tab) tab.opener = null;
              try {
                const { data, error } = await supabaseClient.storage
                  .from("lieferschein")
                  .createSignedUrl(k.lieferschein_pfad, 600);
                if (error) throw error;
                if (tab && !tab.closed) tab.location.replace(data.signedUrl);
                else {
                  const a = node("a", "Lieferschein hier \u{f6}ffnen", "btn");
                  a.href = data.signedUrl;
                  a.target = "_blank";
                  a.rel = "noopener noreferrer";
                  msg.hidden = false;
                  msg.replaceChildren(a);
                }
              } catch (e) {
                if (tab) tab.close();
                msg.hidden = false;
                msg.textContent = "\u{d6}ffnen fehlgeschlagen: " + e.message;
              }
            }),
          );
        if (k.letzter_lieferschein_pfad)
          row.append(
            button("Letzten \u{f6}ffnen", async () => {
              const tab = window.open("about:blank", "_blank");
              if (tab) tab.opener = null;
              try {
                const { data, error } = await supabaseClient.storage
                  .from("lieferschein")
                  .createSignedUrl(k.letzter_lieferschein_pfad, 600);
                if (error) throw error;
                if (tab && !tab.closed) tab.location.replace(data.signedUrl);
                else {
                  const a = node("a", "Lieferschein hier \u{f6}ffnen", "btn");
                  a.href = data.signedUrl;
                  a.target = "_blank";
                  a.rel = "noopener noreferrer";
                  msg.hidden = false;
                  msg.replaceChildren(a);
                }
              } catch (e) {
                if (tab) tab.close();
                msg.hidden = false;
                msg.textContent = "\u{d6}ffnen fehlgeschlagen: " + e.message;
              }
            }),
          );
        const uploadArea = node("div", undefined, "document-upload");
        uploadArea.hidden = true;
        const toggle = button(k.lieferschein_pfad ? "Ersetzen" : "Hochladen", () => {
          uploadArea.hidden = !uploadArea.hidden;
          toggle.setAttribute("aria-expanded", String(!uploadArea.hidden));
        });
        toggle.setAttribute("aria-expanded", "false");
        row.append(toggle);
        const file = node("input");
        file.type = "file";
        file.accept = ".pdf,.jpg,.jpeg,.png,.webp";
        file.setAttribute(
          "aria-label",
          "Lieferschein f\u{fc}r " + k.name + " ausw\u{e4}hlen",
        );
        const hint = node("p", "PDF, JPG, PNG oder WebP \u{b7} bis 10 MB", "muted");
        const upload = button("\u{1f4e4} Hochladen", async () => {
          const f = file.files[0],
            types = {
              pdf: "application/pdf",
              jpg: "image/jpeg",
              jpeg: "image/jpeg",
              png: "image/png",
              webp: "image/webp",
            };
          if (!f) throw new Error("Bitte zuerst eine Datei ausw\u{e4}hlen.");
          const ext = f.name.split(".").pop().toLowerCase();
          if (!Object.hasOwn(types, ext))
            throw new Error("Bitte PDF, JPG, PNG oder WebP ausw\u{e4}hlen.");
          if (!f.size || f.size > 10 * 1024 * 1024)
            throw new Error(
              "Bitte eine nicht leere Datei bis 10 MB ausw\u{e4}hlen.",
            );
          if (
            k.lieferschein_pfad &&
            !confirm("Den hinterlegten Lieferschein ersetzen?")
          )
            return;
          file.disabled = true;
          msg.hidden = false;
          msg.textContent = "Lieferschein wird hochgeladen \u{2026}";
          try {
            const { data: auth, error: ae } = await supabaseClient.auth.getUser();
            if (ae) throw ae;
            if (!auth.user) throw new Error("Bitte anmelden.");
            const path =
              auth.user.id + "/" + k.id + "/" + crypto.randomUUID() + "." + ext;
            const { error } = await supabaseClient.storage
              .from("lieferschein")
              .upload(path, f, { contentType: types[ext], upsert: false });
            if (error) throw error;
            await updateCustomer(k.id, { lieferschein_pfad: path });
            k.lieferschein_pfad = path;
            if (page === t && userId === auth.user.id) renderTour(t);
          } catch (e) {
            msg.textContent = "Hochladen fehlgeschlagen: " + e.message;
          } finally {
            file.disabled = false;
          }
        });
        uploadArea.append(file, hint, upload);
        box.append(uploadArea);
        container.append(box);
      }

      // ============================================================
      // TOUR ZURUECKSETZEN: zwei Bestaetigungen
      // ============================================================
      async function resetTour(t) {
        if (
          !confirm(
            names[t] +
              " zur\u{fc}cksetzen?\n\n" +
              "Alle Kundenauswahlen und Erledigt-Markierungen dieser Tour werden zur\u{fc}ckgesetzt. Auch Kartonnummern, Paketanzahlen und Lagerorte werden geleert.\n\n" +
              "Namen, Adressen, Kontakte, Notizen und letzte Besuche bleiben erhalten. Aktuelle Lieferscheine werden als letzter Lieferschein archiviert.",
          )
        )
          return;
        if (
          !confirm(
            "Sind Sie wirklich sicher?\n\n" +
              "Auswahl, Erledigt-Markierungen und die Beladeangaben aller Kunden dieser Tour werden zur\u{fc}ckgesetzt. Bitte Kartonnummer, Paketanzahl und Lagerort vor der n\u{e4}chsten Fahrt neu eintragen.",
          )
        )
          return;
        const { data, error } = await supabaseClient
          .from("kunden")
          .update({ geplant: false, erledigt: false, kartonnummer: null, paketanzahl: null, lagerort: null, abgeben_bei_id: null, lieferschein_pfad: null })
          .eq("tour", t)
          .select("id");
        if (error) throw error;
        if (rows.length > 0 && !data?.length) {
          throw new Error("Die Tour konnte nicht zur\u{fc}ckgesetzt werden.");
        }
        const s = state(t);
        s.gestartet = false;
        s.pause = false;
        s.hotel = "";
        saveState(t);
        views[t] = "planung";
        await loadCustomers(t);
      }
    </script>
