<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f4">
  <title>Weintour</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f4f4f4;
      color:#111;
    }

    .wrap{
      max-width:620px;
      margin:auto;
      padding:24px 16px 40px;
    }

    h1{
      font-size:32px;
      margin:8px 0 24px;
    }

    .card{
      background:white;
      border-radius:16px;
      padding:18px;
      margin-bottom:16px;
      box-shadow:0 1px 6px #00000012;
    }

    .menuBtn{
      width:100%;
      padding:18px;
      margin:8px 0;
      font-size:19px;
      font-weight:700;
      border-radius:12px;
      border:1px solid #ccc;
      background:white;
      text-align:left;
      cursor:pointer;
    }

    .menuBtn span{
      float:right;
      color:#777;
    }

    .sub{
      color:#666;
      font-size:14px;
      margin-top:4px;
    }
  </style>
</head>

<body>
  <main class="wrap">

    <h1>🍇 Weintour</h1>

    <section class="card">
      <button class="menuBtn" onclick="zeigebereic('kunde')>
        ➕ Kunde anlegen
        <span>›</span>
      </button>

      <div class="sub">
        Neue Kunden mit Adresse, Telefon und Tour-Zuordnung anlegen.
      </div>
    </section>

    <section class="card">
      <button class="menuBtn" onclick="zeigebereic('muenchen')>
        🚚 München-Tour
        <span>›</span>
      </button>

      <div class="sub">
        Kunden im Süden planen, aktivieren und abarbeiten.
      </div>
    </section>

    <section class="card">
      <button class="menuBtn" onclick="zeigebereic('berlin')>
        🚚 Berlin-Tour
        <span>›</span>
      </button>

      <div class="sub">
        Kunden im Norden planen, aktivieren und abarbeiten.
      </div>
    </section>

<section id="bereich" class="card" style="display:none;">
  <button class="menuBtn" onclick="zeigeStart()">← Zurück</button>
  <h2 id="bereichTitel"></h2>
  <div id="bereichInhalt"></div>
</section>
    
  </main>

  <script>
function zeigeBereich(typ) {
  const bereich = document.getElementById("bereich");
  const titel = document.getElementById("bereichTitel");
  const inhalt = document.getElementById("bereichInhalt");

  document.querySelectorAll(".card").forEach(card => {
    card.style.display = "none";
  });

  bereich.style.display = "block";

  if (typ === "kunde") {
    titel.textContent = "Kunde anlegen";
    inhalt.innerHTML = "<p>Hier kommt als Nächstes das Kundenformular hinein.</p>";
  }

  if (typ === "muenchen") {
    titel.textContent = "München-Tour";
    inhalt.innerHTML = "<p>Hier kommt später die Kundenliste für die München-Tour hinein.</p>";
  }

  if (typ === "berlin") {
    titel.textContent = "Berlin-Tour";
    inhalt.innerHTML = "<p>Hier kommt später die Kundenliste für die Berlin-Tour hinein.</p>";
  }
}

function zeigeStart() {
  document.querySelectorAll(".card").forEach(card => {
    card.style.display = "block";
  });

  document.getElementById("bereich").style.display = "none";
}
</script>  
</body>
</html>
