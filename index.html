<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f4">
  <title>Weintour</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f4f4f4;
      color:#111;
    }

    .wrap{ 
      max-width:620px;
      margin:auto;
      padding:24px 16px 40px;
    }

    h1{
      font-size:32px;
      margin:8px 0 24px;
    }

    .card{
      background:white;
      border-radius:16px;
      padding:18px;
      margin-bottom:16px;
      box-shadow:0 1px 6px #00000012;
    }

    .menuBtn{
      width:100%;
      padding:18px;
      margin:8px 0;
      font-size:19px;
      font-weight:700;
      border-radius:12px;
      border:1px solid #ccc;
      background:white;
      text-align:left;
      cursor:pointer;
    }

    .menuBtn span{
      float:right;
      color:#777;
    }

    .sub{
      color:#666;
      font-size:14px;
      margin-top:4px;
    }
  </style>
</head>

<body>
  <main class="wrap">

    <h1>🍇 Weintour</h1>

<button id="abmeldenButton"
        type="button"
        class="menuBtn"
        style="display:none;"
        onclick="abmelden()">
  Abmelden
</button>
    
<section id="loginBox">
  <h2>Anmelden</h2>

  <form onsubmit="anmelden(event)"
        style="display:grid;gap:12px;margin-bottom:20px;">
    <input id="loginEmail"
           type="email"
           placeholder="E-Mail"
           autocomplete="username"
           required
           style="padding:14px;font-size:17px;">

    <input id="loginPasswort"
           type="password"
           placeholder="Passwort"
           autocomplete="current-password"
           required
           style="padding:14px;font-size:17px;">

    <button id="loginButton"
            type="submit"
            class="menuBtn">Anmelden</button>

    <p id="loginMeldung" role="status"></p>
  </form>
</section>
    
    <section class="card">
  <button class="menuBtn" onclick="zeigeBereich('kunde')">
    <strong>➕ Kunde anlegen</strong><br>
    <small>Neue Kunden mit Adresse, Telefon und Tour-Zuordnung anlegen.</small>
    <span>›</span>
  </button>
</section>

<section class="card">
  <button class="menuBtn" onclick="zeigeBereich('muenchen')">
    <strong>🚚 München-Tour</strong><br>
    <small>Kunden im Süden planen, aktivieren und abarbeiten.</small>
    <span>›</span>
  </button>
</section>

<section class="card">
  <button class="menuBtn" onclick="zeigeBereich('berlin')">
    <strong>🚚 Berlin-Tour</strong><br>
    <small>Kunden im Norden planen, aktivieren und abarbeiten.</small>
    <span>›</span>
  </button>
</section>

<section id="bereich" class="card" style="display:none;">
  <button class="menuBtn" onclick="zeigeStart()">← Zurück</button>
  <h2 id="bereichTitel"></h2>
  <div id="bereichInhalt"></div>
</section>
    
  </main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    const SUPABASE_URL = "https://grrkvuqxjglfuynmxegv.supabase.co";
const SUPABASE_KEY = "sb_publishable_5P58BQr8tEksRLUqb8vmOg_uEM_MA24";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
function zeigeBereich(typ) {
  const bereich = document.getElementById("bereich");
  const titel = document.getElementById("bereichTitel");
  const inhalt = document.getElementById("bereichInhalt");

  document.querySelectorAll(".card").forEach(card => {
    card.style.display = "none";
  });

  bereich.style.display = "block";

  if (typ === "kunde") {
  titel.textContent = "➕ Kunde anlegen";

  inhalt.innerHTML = `
    <div style="display:grid;gap:12px;">

      <input id="kundeName" type="text"
        placeholder="Firma / Name"
        style="padding:14px;font-size:17px;border:1px solid #ccc;border-radius:10px;">

      <input id="ansprechpartner" type="text"
        placeholder="Ansprechpartner"
        style="padding:14px;font-size:17px;border:1px solid #ccc;border-radius:10px;">

      <input id="strasse" type="text"
        placeholder="Straße und Hausnummer"
        style="padding:14px;font-size:17px;border:1px solid #ccc;border-radius:10px;">

      <input id="plz" type="text"
        placeholder="PLZ"
        style="padding:14px;font-size:17px;border:1px solid #ccc;border-radius:10px;">

      <input id="ort" type="text"
        placeholder="Ort"
        style="padding:14px;font-size:17px;border:1px solid #ccc;border-radius:10px;">

      <input id="telefon" type="tel"
        placeholder="Telefon"
        style="padding:14px;font-size:17px;border:1px solid #ccc;border-radius:10px;">

      <select id="tour"
        style="padding:14px;font-size:17px;border:1px solid #ccc;border-radius:10px;background:white;">
        <option value="">Tour auswählen</option>
        <option value="muenchen">München-Tour</option>
        <option value="berlin">Berlin-Tour</option>
      </select>

      <textarea id="notiz"
        placeholder="Notiz"
        rows="4"
        style="padding:14px;font-size:17px;border:1px solid #ccc;border-radius:10px;"></textarea>

      <button type="button"
        onclick="kundeSpeichern()"
        style="padding:15px;font-size:18px;font-weight:700;border-radius:10px;border:1px solid #bbb;cursor:pointer;">
        💾 Kunde speichern
      </button>

    </div>
  `;
}
if (typ === "muenchen" || typ === "berlin") {
  titel.textContent =
    typ === "muenchen" ? "München-Tour" : "Berlin-Tour";

  kundenLaden(typ);
}
}

async function kundenLaden(tour) {
  const inhalt = document.getElementById("bereichInhalt");
  inhalt.textContent = "Kunden werden geladen …";

  try {
    const { data, error } = await supabaseClient
      .from("kunden")
      .select("*")
      .eq("tour", tour)
      .order("name");

    if (error) throw error;

    inhalt.replaceChildren();

    if (data.length === 0) {
      inhalt.textContent = "Für diese Tour sind noch keine Kunden gespeichert.";
      return;
    }

    for (const kunde of data) {
      const eintrag = document.createElement("div");
      eintrag.style.cssText =
        "padding:16px 0;border-bottom:1px solid #ddd;";

      const name = document.createElement("strong");
      name.textContent = kunde.name;
      eintrag.appendChild(name);

      const details = [
        kunde.ansprechpartner,
        kunde.strasse,
        [kunde.plz, kunde.ort].filter(Boolean).join(" "),
        kunde.telefon,
        kunde.notiz
      ];

      for (const text of details) {
        if (!text) continue;
        const zeile = document.createElement("div");
        zeile.textContent = text;
        zeile.style.whiteSpace = "pre-wrap";
        eintrag.appendChild(zeile);
      }

const bearbeitenButton = document.createElement("button");
bearbeitenButton.type = "button";
bearbeitenButton.textContent = "✏️ Bearbeiten";
bearbeitenButton.style.cssText =
  "margin:12px 8px 0 0;padding:10px;border-radius:8px;cursor:pointer;";

bearbeitenButton.onclick = () => kundeBearbeiten(kunde);
eintrag.appendChild(bearbeitenButton);

      
const loeschenButton = document.createElement("button");
loeschenButton.type = "button";
loeschenButton.textContent = "🗑️ Löschen";
loeschenButton.style.cssText =
  "margin-top:12px;padding:10px;border-radius:8px;cursor:pointer;";

loeschenButton.onclick = () =>
  kundeLoeschen(kunde.id, kunde.name, tour, loeschenButton);

eintrag.appendChild(loeschenButton);
      
      inhalt.appendChild(eintrag);
    }
  } catch (error) {
    inhalt.textContent = "Laden fehlgeschlagen: " + error.message;
  }
}
    
function zeigeStart() {
  document.querySelectorAll(".card").forEach(card => {
    card.style.display = "block";
  });

  document.getElementById("bereich").style.display = "none";
}

async function kundeSpeichern() {
  const wert = (id) =>
    document.getElementById(id).value.trim();

  const kunde = {
    name: wert("kundeName"),
    ansprechpartner: wert("ansprechpartner"),
    strasse: wert("strasse"),
    plz: wert("plz"),
    ort: wert("ort"),
    telefon: wert("telefon"),
    tour: wert("tour"),
    notiz: wert("notiz")
  };

  if (!kunde.name || !kunde.tour) {
    alert("Bitte Firma / Name eingeben und eine Tour auswählen.");
    return;
  }

  const button = document.querySelector(
    'button[onclick="kundeSpeichern()"]'
  );
  button.disabled = true;

  try {
    const { error } = await supabaseClient
      .from("kunden")
      .insert([kunde]);

    if (error) throw error;

    alert("Kunde wurde gespeichert.");
    zeigeStart();
  } catch (error) {
    alert("Speichern fehlgeschlagen: " + error.message);
  } finally {
    button.disabled = false;
  }
}

async function anmelden(event) {
  event.preventDefault();

  const button = document.getElementById("loginButton");
  const meldung = document.getElementById("loginMeldung");
  const passwort = document.getElementById("loginPasswort");

  button.disabled = true;
  meldung.textContent = "Anmeldung läuft …";

  try {
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value.trim(),
      password: passwort.value
    });

    if (error) throw error;

    passwort.value = "";
    document.getElementById("loginBox").style.display = "none";
    zeigeStart();
  } catch (error) {
    meldung.textContent = "Anmeldung fehlgeschlagen: " + error.message;
  } finally {
    button.disabled = false;
  }
}

async function anmeldungPruefen() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    document.getElementById("loginMeldung").textContent =
      "Anmeldung konnte nicht geprüft werden: " + error.message;
    return;
  }

  document.getElementById("loginBox").style.display =
    data.session ? "none" : "block";
}

anmeldungPruefen();

async function abmelden() {
  try {
    const { error } = await supabaseClient.auth.signOut({
      scope: "local"
    });

    if (error) throw error;

    window.location.reload();
  } catch (error) {
    alert("Abmelden fehlgeschlagen: " + error.message);
  }
}

supabaseClient.auth.onAuthStateChange((_event, session) => {
  document.getElementById("abmeldenButton").style.display =
    session ? "block" : "none";

  document.getElementById("loginBox").style.display =
    session ? "none" : "block";
});

async function kundeLoeschen(id, name, tour, button) {
  if (!confirm('Kunde "' + name + '" wirklich löschen?')) {
    return;
  }

  button.disabled = true;

  try {
    const { data, error } = await supabaseClient
      .from("kunden")
      .delete()
      .eq("id", id)
      .select("id");

    if (error) throw error;

    if (!data || data.length === 0) {
      throw new Error("Der Kunde konnte nicht gelöscht werden.");
    }

    await kundenLaden(tour);
  } catch (error) {
    alert("Löschen fehlgeschlagen: " + error.message);
  } finally {
    button.disabled = false;
  }
}

function kundeBearbeiten(kunde) {
  zeigeBereich("kunde");
  document.getElementById("bereichTitel").textContent =
    "✏️ Kunde bearbeiten";

  const felder = {
    kundeName: "name",
    ansprechpartner: "ansprechpartner",
    strasse: "strasse",
    plz: "plz",
    ort: "ort",
    telefon: "telefon",
    tour: "tour",
    notiz: "notiz"
  };

  for (const [id, spalte] of Object.entries(felder)) {
    document.getElementById(id).value = kunde[spalte] ?? "";
  }

  const button = document.querySelector(
    'button[onclick="kundeSpeichern()"]'
  );

  button.textContent = "💾 Änderungen speichern";
  button.onclick = () => kundeAenderungSpeichern(kunde.id, button);
}

async function kundeAenderungSpeichern(id, button) {
  const wert = (feld) =>
    document.getElementById(feld).value.trim();

  const kunde = {
    name: wert("kundeName"),
    ansprechpartner: wert("ansprechpartner"),
    strasse: wert("strasse"),
    plz: wert("plz"),
    ort: wert("ort"),
    telefon: wert("telefon"),
    tour: wert("tour"),
    notiz: wert("notiz")
  };

  if (!kunde.name || !kunde.tour) {
    alert("Bitte Firma / Name eingeben und eine Tour auswählen.");
    return;
  }

  button.disabled = true;

  try {
    const { data, error } = await supabaseClient
      .from("kunden")
      .update(kunde)
      .eq("id", id)
      .select("id");

    if (error) throw error;

    if (!data || data.length === 0) {
      throw new Error("Der Kunde konnte nicht geändert werden.");
    }

    zeigeBereich(kunde.tour);
  } catch (error) {
    alert("Ändern fehlgeschlagen: " + error.message);
  } finally {
    button.disabled = false;
  }
}

    
</script>    
</body>
</html>
